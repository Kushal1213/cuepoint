name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install desktop dependencies
        working-directory: app
        run: npm ci

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build bundled local service
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean cuepoint_backend.spec
          Copy-Item dist/cuepoint-backend.exe ../app/src-tauri/resources/backend/cuepoint-backend.exe

      - name: Build Windows installers
        working-directory: app
        run: npm run tauri build

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cuepoint ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
